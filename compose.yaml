services:
  mysql:
    image: mysql:latest
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: housestock
      MYSQL_USER: housestock_user
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: seq_logs
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"   # Serilog sink endpoint
      - "8080:80"     # Seq web UI  →  http://localhost:8080
    volumes:
      - seq_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  seq_data: